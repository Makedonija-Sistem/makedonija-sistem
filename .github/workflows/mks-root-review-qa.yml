
name: MKS root review safety gate (NO DEPLOY)

on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'README.md'
      - 'VERSION'
      - 'legal/**'
      - 'scripts/mks_root_review_qa.py'
      - '.github/workflows/mks-root-review-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  root-review-qa:
    name: Static and JavaScript review gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR source (read-only)
        uses: actions/checkout@v4
      - name: Run offline review checks
        run: python3 scripts/mks_root_review_qa.py
