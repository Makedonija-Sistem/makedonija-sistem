name: MKS Cloudflare linking gate (NO DEPLOY)

on:
  pull_request:
    paths:
      - "wrangler.jsonc"
      - "scripts/mks_cloudflare_stage.py"
      - "scripts/test_mks_cloudflare_stage.py"
      - "docs/MKS_CLOUDFLARE_LINK_REVIEW_20261114.md"
      - ".github/workflows/mks-cloudflare-link-review.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safe-stage:
    name: Offline asset allowlist and release-gate checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read-only checkout
        uses: actions/checkout@v4
      - name: Run isolation regression tests
        run: python3 -m unittest discover -s scripts -p 'test_mks_cloudflare_stage.py' -v
      - name: Verify Cloudflare settings are review-scoped
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          cfg = json.loads(Path('wrangler.jsonc').read_text(encoding='utf-8'))
          assert cfg['name'] == 'makedonija-sistem-preview'
          assert cfg['assets']['directory'] == './dist/cloudflare'
          assert 'main' not in cfg, 'Script entrypoint requires independent Worker equivalence review'
          print('PASS: static-only Worker review configuration; no deployment action')
          PY
      - name: Stage public assets ONLY, without deploying
        run: python3 scripts/mks_cloudflare_stage.py
      - name: Check archive, credentials and internal files stay excluded
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0, str(Path('scripts').resolve()))
          from mks_cloudflare_stage import PUBLIC_FILES
          base = Path('dist/cloudflare')
          found = {str(p.relative_to(base)) for p in base.rglob('*') if p.is_file()}
          assert found == set(PUBLIC_FILES), sorted(found ^ set(PUBLIC_FILES))
          assert not (base / 'archive').exists()
          assert not (base / '.github').exists()
          assert not (base / 'docs').exists()
          print(f'PASS: {len(found)} explicitly allowlisted public files, zero extra files')
          PY
