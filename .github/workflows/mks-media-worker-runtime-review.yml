name: MKS MEDIA CONNECT SQLite Worker runtime QA (LOCAL ONLY)
on:
  pull_request:
    paths:
      - "media-connect/worker/invite-worker.mjs"
      - "media-connect/worker/wrangler.invite.pilot.example.jsonc"
      - "scripts/mks_media_worker_runtime_smoke.cjs"
      - ".github/workflows/mks-media-worker-runtime-review.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-worker-qa:
    name: Real workerd + SQLite Durable Object smoke (NO DEPLOY)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout without credentials
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Validate test scripts and Worker syntax
        run: |
          node --check media-connect/worker/invite-worker.mjs
          node --check scripts/mks_media_worker_runtime_smoke.cjs
      - name: Install pinned Wrangler outside repo
        run: npm install --prefix /tmp/mks-wrangler --no-save --no-audit --no-fund wrangler@4.162.0
      - name: Run one-time invitations in local Workers runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/mks-worker-local
          cp media-connect/worker/invite-worker.mjs /tmp/mks-worker-local/invite-worker.mjs
          python3 - <<'PY'
          import json
          cfg={
            "name":"mks-media-private-local-qa",
            "main":"./invite-worker.mjs",
            "compatibility_date":"2026-11-15",
            "workers_dev":False,
            "vars":{
              "ENABLED":"true",
              "HUMAN_GATE_APPROVED":"true",
              "ALLOWED_ORIGIN":"https://preview.example.test",
              "LIVEKIT_URL":"wss://livekit.mock.test",
              "ROOM_NAME":"mks_local_test",
              "LIVEKIT_API_KEY":"API_TEST_KEY_12345",
              "LIVEKIT_API_SECRET":"TEST_LIVEKIT_SECRET_LOCAL_ONLY_ABCDEFGHIJKLMNOPQRSTUVWXYZ_1234",
              "ADMIN_INVITE_TOKEN":"TEST_ADMIN_TOKEN_FOR_LOCAL_QA_ABCDEFGHIJKLMNOPQRSTUVWXYZ_1234",
              "ISSUE_CAP_HOST":"1",
              "ISSUE_CAP_SPEAKER":"3",
              "ISSUE_CAP_VIEWER":"5"
            },
            "durable_objects":{"bindings":[{"name":"INVITES","class_name":"InviteRegistry"}]},
            "migrations":[{"tag":"v1","new_sqlite_classes":["InviteRegistry"]}],
            "ratelimits":[{"name":"JOIN_LIMITER","namespace_id":"3215","simple":{"limit":40,"period":60}}]
          }
          with open("/tmp/mks-worker-local/wrangler.json","w",encoding="utf-8") as f:
            json.dump(cfg,f)
          PY
          /tmp/mks-wrangler/node_modules/.bin/wrangler dev \
            --local --ip 127.0.0.1 --port 8791 \
            --config /tmp/mks-worker-local/wrangler.json \
            --persist-to /tmp/mks-worker-local/storage \
            > /tmp/mks-worker-runtime.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in {1..50}; do
            if curl -fsS -o /dev/null http://127.0.0.1:8791/health; then ready=1; break; fi
            if ! kill -0 "$server_pid" 2>/dev/null; then break; fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then
            tail -n 100 /tmp/mks-worker-runtime.log
            exit 1
          fi
          node scripts/mks_media_worker_runtime_smoke.cjs
